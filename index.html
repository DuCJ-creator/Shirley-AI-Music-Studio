<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shirley's AI Music Studio | Moonlight Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #05040a; --accent: #9fffe6; --ink: #e7f7f7;
      --clock-size: min(72vw, 420px);
      --record-size: 100px;
    }

    body {
      margin: 0; background: var(--bg-0); color: var(--ink);
      font-family: "Orbitron", sans-serif; overflow: hidden;
      height: 100vh; display: flex; align-items: center; justify-content: center;
    }

    #particle-bg { position: fixed; inset: 0; z-index: 0; }

    /* 標題復刻 */
    #header {
      position: absolute; top: 10%; left: 8%; z-index: 10;
      text-align: left; pointer-events: none;
    }
    #main-title {
      font-size: 2.2rem; letter-spacing: 0.35em; margin: 0; font-weight: 700;
      text-shadow: 0 0 15px rgba(159,255,230,0.5);
    }
    #sub-title {
      font-family: "Cormorant Garamond", serif; font-size: 1.3rem;
      letter-spacing: 0.6em; margin-top: 8px; opacity: 0.8;
    }

    /* 表盤系統 */
    #clock-container {
      position: relative; right: 5%;
      width: var(--clock-size); height: var(--clock-size);
      z-index: 5;
    }
    .clock-outer {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1px solid rgba(159, 255, 230, 0.2);
      background: radial-gradient(circle, rgba(20,20,30,0.6) 0%, #050509 100%);
    }

    /* 鑽石💎時標 - 靜態發光，固定在整點位置 */
    .hour-marker {
      position: absolute; 
      width: 16px; height: 16px;
      background: 
        radial-gradient(circle at 30% 30%, 
          rgba(255, 255, 255, 1) 0%, 
          var(--accent) 40%, 
          rgba(159, 255, 230, 0.3) 70%,
          transparent 90%
        );
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      filter: drop-shadow(0 0 6px var(--accent));
      z-index: 6;
      opacity: 0.85;
      transform: rotate(var(--diamond-rotation, 0deg)) translate(-50%, -50%);
      transition: all 0.3s ease;
      pointer-events: auto; /* 確保可以點擊 */
    }

    /* 移除跳動動畫，改為鼠標懸停效果 */
    .hour-marker:hover {
      filter: drop-shadow(0 0 12px var(--accent)) 
              drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
      opacity: 1;
      transform: rotate(var(--diamond-rotation, 0deg)) translate(-50%, -50%) scale(1.3);
    }

    /* 特別強調12點、3點、6點、9點的鑽石 */
    .hour-marker.hour-12,
    .hour-marker.hour-3,
    .hour-marker.hour-6,
    .hour-marker.hour-9 {
      width: 18px;
      height: 18px;
      filter: drop-shadow(0 0 8px var(--accent));
    }

    #record {
      position: absolute; top: 50%; left: 50%;
      width: var(--record-size); height: var(--record-size);
      transform: translate(-50%, -50%); border-radius: 50%;
      border: 2px solid var(--accent); overflow: hidden;
      cursor: pointer; z-index: 20; box-shadow: 0 0 20px var(--accent);
    }
    video { width: 100%; height: 100%; object-fit: cover; }

    #hand {
      position: absolute; width: 3px; height: 44%;
      background: linear-gradient(to top, var(--accent), transparent);
      bottom: 50%; left: calc(50% - 1.5px); transform-origin: bottom center;
      transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1);
      z-index: 10;
    }

    /* 導航 */
    .nav-node {
      position: absolute; text-decoration: none; color: var(--ink);
      z-index: 25; font-size: 0.85rem; font-weight: bold;
      padding: 10px 20px; border-radius: 30px;
      background: rgba(10,12,18,0.85); border: 1px solid rgba(159,255,230,0.2);
      transition: 0.3s; white-space: nowrap;
    }
    .nav-node:hover { border-color: var(--accent); box-shadow: 0 0 15px var(--accent); transform: translateY(-50%) scale(1.1); }
    #node-emo { left: -50px; top: 50%; transform: translateY(-50%); cursor: pointer; user-select: none; }
    #node-study { right: -50px; top: 50%; transform: translateY(-50%); }

    /* 擺爛音樂播放器 */
    #emo-player {
      position: absolute; left: -270px; top: 50%;
      transform: translateY(-50%);
      width: 200px;
      background: rgba(5, 4, 10, 0.95);
      border: 1px solid rgba(159,255,230,0.3);
      border-radius: 14px;
      padding: 14px 16px;
      z-index: 50;
      display: none;
      box-shadow: 0 0 25px rgba(159,255,230,0.15);
    }
    #emo-player.visible { display: block; animation: fadeSlideIn 0.3s ease; }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(-50%) translateX(8px); }
      to   { opacity: 1; transform: translateY(-50%) translateX(0); }
    }
    .ep-title {
      color: var(--accent); letter-spacing: 0.15em; font-size: 0.6rem;
      margin-bottom: 8px; opacity: 0.75; font-family: "Orbitron", sans-serif;
    }
    .ep-track {
      color: var(--ink); font-family: "Cormorant Garamond", serif;
      font-size: 0.88rem; margin-bottom: 12px; opacity: 0.85;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ep-controls {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .ep-btn {
      background: none; border: 1px solid rgba(159,255,230,0.25);
      color: var(--accent); border-radius: 50%;
      width: 28px; height: 28px; cursor: pointer; font-size: 0.8rem;
      display: flex; align-items: center; justify-content: center;
      transition: 0.2s; flex-shrink: 0;
    }
    .ep-btn:hover { background: rgba(159,255,230,0.1); box-shadow: 0 0 8px var(--accent); }
    .ep-btn.playpause { width: 34px; height: 34px; font-size: 1rem; }
    .ep-dots { display: flex; gap: 5px; flex-wrap: wrap; }
    .ep-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(159,255,230,0.2); cursor: pointer; transition: 0.2s;
    }
    .ep-dot.active { background: var(--accent); box-shadow: 0 0 5px var(--accent); }

    /* 歌詞軌道 - 改進漂浮邏輯 */
    #lyric-orbit-container { position: absolute; inset: 0; pointer-events: none; }
    .lyric-card {
      position: absolute; width: 220px; pointer-events: auto;
      background: rgba(15, 20, 35, 0.8); border: 1px solid rgba(159, 255, 230, 0.2);
      border-radius: 10px; transition: width 0.4s, background 0.4s, transform 0.1s linear;
      padding: 12px; overflow: hidden;
    }
    .lyric-card.expanded {
      width: 280px; background: rgba(20, 30, 50, 0.98);
      border-color: var(--accent); z-index: 1000 !important;
    }
    .lyric-title { 
      font-size: 0.75rem; color: var(--accent); font-weight: bold; 
      letter-spacing: 1px; cursor: pointer; display: flex; justify-content: space-between;
    }
    .lyric-content {
      max-height: 0; opacity: 0; margin-top: 0;
      font-family: "Cormorant Garamond", serif; font-size: 0.9rem;
      line-height: 1.4; color: #fff; transition: all 0.4s ease;
      white-space: pre-line;
    }
    .expanded .lyric-content { max-height: 250px; opacity: 1; margin-top: 10px; }
  </style>
</head>
<body>

  <div id="particle-bg"></div>

  <div id="header">
    <h1 id="main-title">SHIRLEY'S AI MUSIC STUDIO</h1>
    <div id="sub-title">月光奏鳴曲</div>
  </div>

  <div id="clock-container">
    <div class="clock-outer"></div>
    <div id="hand"></div>
    
    <!-- 鑽石💎時標會在 JavaScript 中動態生成 -->
    
    <div class="nav-node" id="node-emo" onclick="toggleEmoPlayer(event)" onmouseenter="setHand(-90)">EMO 擺爛中</div>

    <!-- 擺爛音樂播放器面板 -->
    <div id="emo-player">
      <div class="ep-title">✦ 擺爛電台 ✦</div>
      <div class="ep-track" id="ep-track-name">— 隨機選曲中 —</div>
      <div class="ep-controls">
        <button class="ep-btn" onclick="prevTrack(event)" title="上一首">&#9664;</button>
        <button class="ep-btn playpause" id="ep-playpause" onclick="toggleEmoPlay(event)" title="播放/暫停">&#9654;</button>
        <button class="ep-btn" onclick="nextTrack(event)" title="下一首">&#9654;&#9654;</button>
      </div>
      <div class="ep-dots" id="ep-dots"></div>
    </div>

    <audio id="emo-audio" loop></audio>
    <div id="record" onclick="togglePlay()">
      <video id="v" loop playsinline><source src="https://ducj-creator.github.io/Shirley-AI-Music-Studio/assets/moonlight%20sonata.mp4" type="video/mp4"></video>
    </div>
    <a href="https://ducj-creator.github.io/Shirley-AI-Music-Studio/learning/index.html" class="nav-node" id="node-study" onmouseenter="setHand(90)">充電學習中</a>
  </div>

  <div id="lyric-orbit-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // 1. 深度星辰背景 (優化：更細、更多、不發熱)
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 1000);
    camera.position.z = 500;
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('particle-bg').appendChild(renderer.domElement);

    const geo = new THREE.BufferGeometry();
    const pCount = 6000; // 增加數量
    const pArr = new Float32Array(pCount * 3);
    for(let i=0; i<pCount*3; i++) pArr[i] = (Math.random()-0.5) * 1200;
    geo.setAttribute('position', new THREE.BufferAttribute(pArr, 3));
    
    // 縮小 size 到 0.8 - 1.2 營造星塵感
    const mat = new THREE.PointsMaterial({ color: 0x9fffe6, size: 0.8, transparent: true, opacity: 0.5, sizeAttenuation: true });
    const particles = new THREE.Points(geo, mat);
    scene.add(particles);

    function animate() {
      requestAnimationFrame(animate);
      particles.rotation.y += 0.0004;
      particles.rotation.z += 0.0002;
      renderer.render(scene, camera);
    }
    animate();

    // 2. 創建鑽石💎時標 - 固定在12個整點位置
    function createDiamondMarkers() {
      const clockContainer = document.getElementById('clock-container');
      const clockSize = parseInt(getComputedStyle(clockContainer).width);
      const center = clockSize / 2;
      const radius = center - 25; // 鑽石距離中心的距離（比之前更靠近邊緣一些）
      
      // 12個整點位置：12點、1點、2點...11點
      const hourPositions = [
        { hour: 12, angle: 0 },    // 12點 - 頂部
        { hour: 1, angle: 30 },    // 1點
        { hour: 2, angle: 60 },    // 2點
        { hour: 3, angle: 90 },    // 3點 - 右側
        { hour: 4, angle: 120 },   // 4點
        { hour: 5, angle: 150 },   // 5點
        { hour: 6, angle: 180 },   // 6點 - 底部
        { hour: 7, angle: 210 },   // 7點
        { hour: 8, angle: 240 },   // 8點
        { hour: 9, angle: 270 },   // 9點 - 左側
        { hour: 10, angle: 300 },  // 10點
        { hour: 11, angle: 330 }   // 11點
      ];
      
      hourPositions.forEach(pos => {
        const angleRad = (pos.angle - 90) * Math.PI / 180; // 從12點開始，順時針計算
        
        // 計算鑽石位置
        const x = center + Math.cos(angleRad) * radius;
        const y = center + Math.sin(angleRad) * radius;
        
        const marker = document.createElement('div');
        marker.className = 'hour-marker';
        marker.classList.add(`hour-${pos.hour}`);
        
        // 設置位置（使用百分比定位，這樣可以適應不同大小的表盤）
        marker.style.left = `${x}px`;
        marker.style.top = `${y}px`;
        
        // 為每個鑽石添加旋轉角度，讓尖角指向中心
        const rotation = pos.angle; // 鑽石指向中心
        marker.style.setProperty('--diamond-rotation', `${rotation}deg`);
        
        // 設置透明度 - 主要四點更亮
        if (pos.hour === 12 || pos.hour === 3 || pos.hour === 6 || pos.hour === 9) {
          marker.style.opacity = '0.95';
        } else {
          marker.style.opacity = '0.8';
        }
        
        // 添加小時數字提示（可選，用於調試）
        marker.title = `${pos.hour}點鐘位置`;
        
        clockContainer.appendChild(marker);
      });
    }

    // 3. 歌詞數據
    const lyricsData = [
      { t: "Verse 1", c: "Close your eyes, let the tide of night pull you deep\nWhere silver whispers through the willow weep\nEvery worry, every weight you carry, set it free\nOn this silent sea, just breathe" },
      { t: "Pre-Chorus", c: "Feel the shadows soften, turning into silk\nAs the constellations witness, spilling their light like milk" },
      { t: "Chorus", c: "Luna, Luna, keeper of the quiet glow\nWashing over every secret that we know\nLuna, Luna, in your phosphorescent tide\nAll our fractured pieces learn to rest inside" },
      { t: "Verse 2", c: "See the dust of stars on your windowpane\nA reminder that even darkness is not in vain\nIt's a blanket, a cradle, a celestial embrace" },
      { t: "Bridge", c: "Hush now\nThe moon is listening\nAll is understood\nIn this velvet nothingness" },
      { t: "Outro", c: "Luna, Luna, keeper of the quiet glow\nWashing over everything we know\nLuna, Luna, in your tender tide\nWe are perfectly alight, inside" }
    ];

    const container = document.getElementById('lyric-orbit-container');
    
    // 初始化位置偏移量，讓卡片一開始就均勻分布
    const cards = lyricsData.map((data, i) => {
      const card = document.createElement('div');
      card.className = 'lyric-card';
      card.innerHTML = `<div class="lyric-title"><span>${data.t}</span><span>＋</span></div><div class="lyric-content">${data.c}</div>`;
      
      // 給予每個卡片一個隨機的初始時間偏移
      card.dataset.offset = Math.random() * 10000; 
      
      card.onclick = (e) => {
        const isExp = card.classList.contains('expanded');
        document.querySelectorAll('.lyric-card').forEach(c => c.classList.remove('expanded'));
        if(!isExp) card.classList.add('expanded');
        e.stopPropagation();
      };
      container.appendChild(card);
      return card;
    });

    function updateOrbit() {
      const now = Date.now();
      const centerX = window.innerWidth * 0.75;
      const centerY = window.innerHeight * 0.5;

      cards.forEach((card, i) => {
        if(card.classList.contains('expanded')) return;

        // 使用初始偏移量，確保一進網頁時卡片就在不同位置
        const offset = parseFloat(card.dataset.offset);
        const time = (now + offset) * 0.00012; 
        
        const angle = time + (i * (Math.PI * 2 / cards.length));
        const x = centerX + Math.cos(angle) * 140; // 軌道寬度
        const y = centerY + Math.sin(angle) * 300; // 軌道高度
        const z = Math.sin(angle);

        card.style.left = `${x}px`;
        card.style.top = `${y}px`;
        card.style.transform = `translate(-50%, -50%) scale(${0.8 + z * 0.12})`;
        card.style.opacity = 0.4 + (z + 1) * 0.3;
        card.style.zIndex = Math.round((z + 1) * 10);
      });
      requestAnimationFrame(updateOrbit);
    }
    updateOrbit();

    const v = document.getElementById('v');
    const hand = document.getElementById('hand');
    
    function togglePlay() { 
      if(v.paused) {
        v.play();
        // 播放時讓所有鑽石更亮一些
        document.querySelectorAll('.hour-marker').forEach(marker => {
          marker.style.filter = 'drop-shadow(0 0 8px var(--accent))';
        });
      } else {
        v.pause();
        // 暫停時鑽石恢復原狀
        document.querySelectorAll('.hour-marker').forEach(marker => {
          if (marker.classList.contains('hour-12') || 
              marker.classList.contains('hour-3') || 
              marker.classList.contains('hour-6') || 
              marker.classList.contains('hour-9')) {
            marker.style.filter = 'drop-shadow(0 0 8px var(--accent))';
          } else {
            marker.style.filter = 'drop-shadow(0 0 6px var(--accent))';
          }
        });
      } 
    }
    
    function setHand(deg) { 
      hand.style.transform = `rotate(${deg}deg)`; 
    }
    
    // 擺爛電台音樂播放器
    const EMO_TRACKS = Array.from({length: 8}, (_, i) =>
      `https://ducj-creator.github.io/releases/pm${i+1}.mp3`
    );
    const TRACK_NAMES = [
      "pm 01 · 月光下的放空",
      "pm 02 · 慢速漂移",
      "pm 03 · 凌晨三點鐘",
      "pm 04 · 什麼都不想做",
      "pm 05 · 雨聲迴響",
      "pm 06 · 懶洋洋星期三",
      "pm 07 · 關機模式",
      "pm 08 · 夢境邊境"
    ];

    let emoCurrentIdx = -1;
    let emoPlaying = false;
    const emoAudio = document.getElementById('emo-audio');
    const emoPlayer = document.getElementById('emo-player');

    // Build track dots
    const dotsEl = document.getElementById('ep-dots');
    EMO_TRACKS.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'ep-dot';
      d.title = TRACK_NAMES[i];
      d.onclick = (e) => { e.stopPropagation(); loadEmoTrack(i); playEmo(); };
      dotsEl.appendChild(d);
    });

    function updateDots() {
      document.querySelectorAll('.ep-dot').forEach((d, i) => {
        d.classList.toggle('active', i === emoCurrentIdx);
      });
    }

    function loadEmoTrack(idx) {
      emoCurrentIdx = idx;
      emoAudio.src = EMO_TRACKS[idx];
      document.getElementById('ep-track-name').textContent = TRACK_NAMES[idx];
      updateDots();
    }

    function pickRandom() {
      let next;
      do { next = Math.floor(Math.random() * EMO_TRACKS.length); }
      while (next === emoCurrentIdx && EMO_TRACKS.length > 1);
      return next;
    }

    function playEmo() {
      emoAudio.play().catch(()=>{});
      emoPlaying = true;
      document.getElementById('ep-playpause').innerHTML = '&#9646;&#9646;';
    }

    function pauseEmo() {
      emoAudio.pause();
      emoPlaying = false;
      document.getElementById('ep-playpause').innerHTML = '&#9654;';
    }

    function toggleEmoPlay(e) {
      if(e) e.stopPropagation();
      if(emoPlaying) { pauseEmo(); }
      else {
        if(emoCurrentIdx === -1) loadEmoTrack(pickRandom());
        playEmo();
      }
    }

    function nextTrack(e) {
      if(e) e.stopPropagation();
      loadEmoTrack(pickRandom());
      if(emoPlaying) playEmo();
    }

    function prevTrack(e) {
      if(e) e.stopPropagation();
      const prev = (emoCurrentIdx - 1 + EMO_TRACKS.length) % EMO_TRACKS.length;
      loadEmoTrack(prev);
      if(emoPlaying) playEmo();
    }

    // Auto-advance on track end (loop is off to allow random next)
    emoAudio.loop = false;
    emoAudio.addEventListener('ended', () => {
      loadEmoTrack(pickRandom());
      playEmo();
    });

    function toggleEmoPlayer(e) {
      if(e) e.stopPropagation();
      const isVisible = emoPlayer.classList.toggle('visible');
      if(isVisible && emoCurrentIdx === -1) {
        loadEmoTrack(pickRandom());
        playEmo();
      }
      setHand(-90);
    }

    // Close player when clicking elsewhere
    window._origClick = window.onclick;
    window.onclick = (e) => {
      if(!emoPlayer.contains(e.target) && e.target.id !== 'node-emo') {
        emoPlayer.classList.remove('visible');
      }
      document.querySelectorAll('.lyric-card').forEach(c => c.classList.remove('expanded'));
    };
  
    
    // 頁面加載完成後創建鑽石時標
    window.addEventListener('load', function() {
      createDiamondMarkers();
      
      // 添加鼠標懸停效果
      const markers = document.querySelectorAll('.hour-marker');
      markers.forEach(marker => {
        marker.addEventListener('mouseenter', function() {
          this.style.filter = 'drop-shadow(0 0 12px var(--accent)) drop-shadow(0 0 6px rgba(255, 255, 255, 0.8))';
          this.style.opacity = '1';
          this.style.zIndex = '15'; // 懸停時在最上層
        });
        
        marker.addEventListener('mouseleave', function() {
          const hour = this.classList[1] ? this.classList[1].replace('hour-', '') : '';
          if (hour === '12' || hour === '3' || hour === '6' || hour === '9') {
            this.style.filter = 'drop-shadow(0 0 8px var(--accent))';
            this.style.opacity = '0.95';
          } else {
            this.style.filter = 'drop-shadow(0 0 6px var(--accent))';
            this.style.opacity = '0.8';
          }
          this.style.zIndex = '6';
        });
      });
    });

    // 視窗大小變化時重新定位鑽石
    window.addEventListener('resize', function() {
      // 移除舊的鑽石
      document.querySelectorAll('.hour-marker').forEach(marker => marker.remove());
      // 重新創建鑽石
      createDiamondMarkers();
    });
  </script>
</body>
</html>
